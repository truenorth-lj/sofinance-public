  <!-- White star inside orange badge -->
  <path d="M29 25.5l1.2 2.4 2.6.4-1.9 1.8.4 2.6-2.3-1.2-2.3 1.2.4-2.6-1.9-1.8 2.6-.4z" fill="#ffffff"/>
