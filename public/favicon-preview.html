
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SoFinance Character Mark Preview</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    body {
      background: #050505;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }
    .preview-section {
      text-align: center;
    }
    h1 { 
      margin: 0 0 10px 0; 
      font-size: 28px;
    }
    .subtitle {
      color: #888;
      font-size: 14px;
      margin-bottom: 30px;
    }
    .logo-preview {
      display: flex;
      gap: 30px;
      align-items: center;
      justify-content: center;
      padding: 50px;
      background: #0a0a0a;
      border-radius: 16px;
      border: 1px solid #262626;
    }
    .logo-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050505;
      border-radius: 8px;
      padding: 12px;
    }
    .size-label { 
      color: #666; 
      font-size: 13px;
      font-weight: 500;
    }
    .header-demo {
      margin-top: 40px;
      padding: 24px;
      background: #0a0a0a;
      border-radius: 16px;
      border: 1px solid #262626;
      width: 100%;
      max-width: 600px;
    }
    .header-content {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .wordmark-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.02em;
    }
    .wordmark-subtitle {
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="preview-section">
    <h1>SoFinance Character Mark</h1>
    <div class="subtitle">Cute Grokbot-style mascot with curious expression</div>
    
    <div class="logo-preview">
      <div class="logo-item">
        <div class="logo-container">
          <img src="logo.svg" width="16" height="16" alt="16x16">
        </div>
        <div class="size-label">16×16 favicon</div>
      </div>
      <div class="logo-item">
        <div class="logo-container">
          <img src="logo.svg" width="32" height="32" alt="32x32">
        </div>
        <div class="size-label">32×32 favicon</div>
      </div>
      <div class="logo-item">
        <div class="logo-container">
          <img src="logo.svg" width="40" height="40" alt="40x40">
        </div>
        <div class="size-label">40×40 header</div>
      </div>
      <div class="logo-item">
        <div class="logo-container">
          <img src="logo.svg" width="64" height="64" alt="64x64">
        </div>
        <div class="size-label">64×64</div>
      </div>
      <div class="logo-item">
        <div class="logo-container">
          <img src="logo.svg" width="128" height="128" alt="128x128">
        </div>
        <div class="size-label">128×128</div>
      </div>
    </div>

    <div class="header-demo">
      <div class="header-content">
        <img src="logo.svg" width="40" height="40" alt="SoFinance">
        <div>
          <div class="wordmark-title">SoFinance</div>
          <div class="wordmark-subtitle">Position performance</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
