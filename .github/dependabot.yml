version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    rebase-strategy: auto
    # Majors are reviewed manually; skip them here.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # postgres is pinned at 3.4.7: 3.4.9 breaks the TransactionSql typing in
      # src/db/migrations.ts and hangs the transaction-timeout abort/reconnect
      # integration test. Revisit before unpinning (see #303).
      - dependency-name: "postgres"
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # e2e has its own npm lockfile and is outside the pnpm workspace.
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    rebase-strategy: auto
    # Majors are reviewed manually; skip them here.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # @solana/web3.js v3 is not API-compatible with the v1 API used in e2e
      # (PublicKey, Keypair, etc.). #515 and #516 still opened a grouped 1→3
      # bump that failed e2e-hermetic, despite the wildcard major ignore above.
      # Stay on v1 until a deliberate migration (see #189).
      - dependency-name: "@solana/web3.js"
        update-types:
          - "version-update:semver-major"
    groups:
      e2e-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    rebase-strategy: auto
    # Majors are reviewed manually; skip them here.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    open-pull-requests-limit: 3
    rebase-strategy: auto
    # Majors are reviewed manually; skip them here.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
